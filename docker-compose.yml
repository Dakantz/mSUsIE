#version: "3" #this gives obsolete warning
services:
  db:
    build: ./pg-vec-geo
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - PGDATA=/var/lib/postgresql/data/pgdata
    ports:
      - "5431:5432"
    volumes:
      - ./data/pg-data:/var/lib/postgresql/data
      - ./data/ingest_data:/ingest_data
  pgadmin:
    image: dpage/pgadmin4:9.8
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: docker@va-tu.at
      PGADMIN_DEFAULT_PASSWORD: postgres
      PGADMIN_LISTEN_PORT: 80
    ports:
      - "10015:80"
    volumes:
      - ./data/servers.json:/pgadmin4/servers.json # preconfigured servers/connections
      - ./data/pgpass:/pgpass # passwords for the connections in this file
      - ./data/pg-admin-data:/var/lib/pgadmin
    links:
      - "db:pgsql-server"
volumes:
  pg-data:
    external: false
